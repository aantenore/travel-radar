# travel-radar defaults. Override any key in <data home>/settings.yaml
# (data home = $TRAVEL_RADAR_HOME or ~/.travel-radar). Relative paths resolve against the data home.
paths:
  db: data/radar.sqlite
  cache_dir: data/cache
  profile: profile.yaml
  trips_dir: trips
  watches_dir: watches
  dossier_checklist: dossier_checklist.yaml   # falls back to the plugin copy

http:
  timeout_s: 20
  user_agent: travel-radar/0.6 (+https://github.com/aantenore/travel-radar)
  cache_ttl_s: 21600   # 6h

sources:
  geocoding: https://geocoding-api.open-meteo.com/v1/search
  climate_archive: https://archive-api.open-meteo.com/v1/archive
  forecast: https://api.open-meteo.com/v1/forecast
  holidays: https://date.nager.at/api/v3/PublicHolidays

geocoding:
  languages: [en]         # names are matched per language: add yours in settings.yaml (e.g. [en, it])
  candidates: 10          # hits requested per name
  candidates_filtered: 100   # when a region/country filter is given
  dominance_ratio: 20     # accept the most populous hit only if this many times larger than the next

climate:
  years_back: 5
  rain_day_mm: 1.0

# Checks per day by days left to departure (first matching rule wins).
cadence:
  - {min_days: 60, per_day: 1}
  - {min_days: 14, per_day: 2}
  - {min_days: 0, per_day: 4}

alerts:
  drop_pct: 10          # drop vs historical median
  new_low: true         # new all-time low
  below_budget: true    # price under the watch budget
  cooldown_h: 24        # do not repeat the same alert kind within N hours
  min_history: 3        # observations required for drop_pct
  suspect_drop_pct: 60  # drops beyond this are likely misreads: re-verify, never notify as a deal

# Which sources may produce a price observation: tier 1 airline, tier 2 travel search/booking site.
# Decided at runtime: the model proposes the entity, code verifies it (tw sources verify / confirm).
reliability:
  # Tiers are decided only at runtime and cached in the data home (no domain lists anywhere).
  verify_ttl_days: 30          # registry (Wikidata) verdicts
  unverified_ttl_days: 1       # registry unreachable/unresolved: retry soon; prices stay context only
  independent_ttl_days: 14     # verdicts confirmed by independent sources found at runtime
  independent_min_sources: 2   # distinct sites, none of them the candidate itself
  inherited_ttl_days: 7        # government status inherited from a parent domain (lower trust)
  # A price alert fires only when independently confirmed within this window: another tier 1/2
  # site, or the same site re-read by an independent extractor (never the same fare-reader twice).
  independent_extractors: [main]
  confirm_window_h: 24
  same_source_tolerance_pct: 1    # same fare re-read on the same site
  cross_source_tolerance_pct: 5   # another tier 1/2 site

# Runtime entity verification. Class ids are Wikidata items (stable identifiers, not knowledge).
wikidata:
  api: https://www.wikidata.org/w/api.php
  sparql: https://query.wikidata.org/sparql
  search_limit: 3
  airline_classes: [Q46970]                          # airline
  travel_classes: [Q118710708, Q114106, Q1276157]    # classes: online travel agency, metasearch engine, travel website
  # Classes checked through the P31/P279 chain. The registry has no class for "flight search /
  # online booking service" (checked 2026-11-18), so the description below is a secondary rule:
  # it counts only when the entity's official website already matches the page exactly.
  travel_description_terms: [flight booking, flight search, airfare, air fare, travel booking, travel search, online travel agency, metasearch]
  redirect_max_hops: 3       # follow moved official websites (same host only)
  # classes: government agency, public authority, diplomatic mission, embassy, ministry of foreign affairs, ministry, intergovernmental org
  government_classes: [Q327333, Q4383245, Q213283, Q3917681, Q7843791, Q20901295, Q192350, Q245065]   # + consulate
  # A country's own official website (P856 of a country / sovereign state item) is its government portal.
  country_classes: [Q6256, Q3624078]
  # Subdomains inherit government status from a verified parent domain, at most this many levels up.
  government_parent_depth: 3

# How pages are read. Order is learned per source from measured outcomes (tw sources plan).
access:
  methods: [webfetch, browser]   # browser = rendered page via the session's browser tools, if available
  api_adapters:                  # used only when the env var holds a key the user configured
    serpapi: {env: SERPAPI_KEY, endpoint: "https://serpapi.com/search.json", engine: google_flights}
  prior_success: 0.5             # assumed success rate of an untried (source, method)
  blocked_backoff_hours: 24      # skip a (source, method) this long after it blocked
  max_attended_searches_per_site: 3   # searches per site in one attended session after a user-solved challenge
  # Generic anti-bot / CAPTCHA page text (UI patterns, not site knowledge). Detection only, never solving.
  challenge_markers: [captcha, px-captcha, recaptcha, hcaptcha, cf-challenge, "are you a robot", "are you a human",
                      "verify you are human", "unusual traffic", "sei una persona o un robot", "non sono un robot",
                      "press and hold", "access denied"]
  max_plan_steps: 6

# Itinerary rules (shape of a fare). Hard filters come from the profile's `flights` preferences.
flights:
  night_window_h: [0, 5]          # a layover covering these local hours counts as overnight
  layover_tolerance_min: 5        # stated vs computed layover duration
  unknown_fit: exclude            # fares without itinerary data when the user has flight preferences
  ranking:                        # rank_cost = price*norm_price + time*norm_time + layover penalty
    price: 0.6
    time: 0.4
    layover_penalty_per_h: 0.02
    shorter_layover_factor: 2.0   # applied when the user prefers shorter layovers

# Fares far ahead are often unpublished placeholders or full fares: kept, but ignored by advise and alerts.
# Market of a watch: international (default) or domestic, set on the watch from the route.
fares:
  provisional_horizon_days: {international: 330, domestic: 120}

# Buy/wait advisor (tw advise). Booking windows in days before departure; first match wins.
# Booking windows are researched at runtime per route and season (tw knowledge, kind booking_window).
# The windows below are only a generic FALLBACK, marked heuristic, used when no fresh research exists.
advise:
  min_history: 5
  trend_days: 7
  rising_trend_pct: 5          # in-window price up this much over trend_days -> buy
  good_percentile: 25          # price at or below this percentile of own history = good
  bad_percentile: 75
  late_days: 21                # inside this, waiting rarely pays
  wait_recheck_days: 7
  close_recheck_days: 3
  high_volatility_cv: 0.15     # coefficient of variation above this lowers confidence
  booking_window_ttl_days: 90
  windows:   # fallback
    - {name: long-haul peak season, haul: long, peak: true, ideal_days: [120, 240], confidence: heuristic,
       source: "rule of thumb from fare-trend studies; calibrate with your own verified history"}
    - {name: long-haul, haul: long, peak: false, ideal_days: [90, 180], confidence: heuristic,
       source: "rule of thumb from fare-trend studies; calibrate with your own verified history"}
    - {name: short-haul peak season, haul: short, peak: true, ideal_days: [60, 120], confidence: heuristic,
       source: "rule of thumb from fare-trend studies; calibrate with your own verified history"}
    - {name: short-haul, haul: short, peak: false, ideal_days: [30, 90], confidence: heuristic,
       source: "rule of thumb from fare-trend studies; calibrate with your own verified history"}

research:
  max_fetches_per_watch: 6   # web pages per watch per run
  max_subagent_calls_per_run: 4   # fare-reader calls per monitoring run; extra watches wait for the next run
  monitor_every_h: 6         # scheduled task frequency

requirements:
  safety_margin_days: 14     # deadline = departure - lead_time - margin
  # Categories whose answer depends on the traveller's nationality: without it they stay `unknown`.
  nationality_dependent: [entry, passport, transit, registration, citizen_registration]
  ttl_days:                  # re-verify after (days), per category
    entry: 14
    passport: 30
    transit: 14
    permits: 14
    registration: 30
    health: 30
    customs: 60
    driving: 60
    drones: 30
    apps: 14
    citizen_registration: 90

geopolitics:
  ttl_days: 7
  news_days: 30              # how far back news is searched

experiences:
  ttl_days: 30

# Consultative intake: which missing facts to ask about first, per step (higher = asked first).
# "trip.<key>" = a fact of the current trip (tw trip fact), everything else = a profile field.
intake:
  max_questions: 3
  # The same question asked at trip level and at profile level: with a trip, the trip key wins.
  equivalent:
    trip.trip_budget_eur: constraints.budget_total_eur
  trip_facts: [trip_budget_eur, dates_flexibility_days, party_size, length_days, must_include, must_avoid]
  steps:
    plan: {constraints.origin_airports: 10, trip.trip_budget_eur: 9, constraints.budget_total_eur: 8,
           trip.dates_flexibility_days: 8, interests: 7, travel_style.pace: 5, travel_style.party: 5, rhythm: 4}
    choose: {trip.dates_flexibility_days: 8, budget_daily_eur: 7, comfort_level: 6, accommodation_style: 5,
             mobility_limits: 5, rhythm: 4, dietary_needs: 3}
    requirements: {traveller.nationality: 10, traveller.passports: 9, traveller.residence_country: 6}
    experiences: {interests: 9, languages: 5, mobility_limits: 5, region_experience: 4, past_trips: 3, dietary_needs: 3}
    monitor: {constraints.origin_airports: 9, constraints.budget_flight_eur: 8, trip.dates_flexibility_days: 6}
    flights: {constraints.origin_airports: 10, flights.max_layover_h: 9, flights.max_stops: 8, flights.prefer_shorter_layovers: 6,
              flights.avoid_self_transfer: 6, flights.avoid_overnight_layover: 5, flights.max_total_h: 4,
              constraints.budget_flight_eur: 7}

rollout:
  shadow_days: 14   # from first use: verdicts are logged and shown on request, not pushed as notifications

ideas:
  check_every_days: 7        # low-frequency deal/season check per idea
  season_lead_months: 3      # flag when the best month is this close

debrief:                     # topics the agent asks about when a trip is marked done
  topics:
    - pace (too fast, right, too slow)
    - crowds and how touristic it felt
    - real spend vs budget
    - places to repeat and places to avoid next time

export:
  recheck_before_days: [14, 3]   # calendar reminders to re-verify safety and entry rules

scoring:
  default_weights: {cost: 0.30, climate: 0.25, crowds: 0.20, authenticity: 0.15, logistics: 0.10}
  cost_full_score_ratio: 0.8   # <= 80% of budget -> full score
  cost_zero_score_ratio: 1.2   # >= 120% of budget -> zero
  # Without a budget (unknown or deferred by the user) cost is scored relative to the options compared:
  # cheapest = 1.0, most expensive = most_expensive_score, linear in between.
  relative_cost:
    most_expensive_score: 0.0
  climate_penalty_per_deg: 0.08
  rain_penalty_per_day: 0.05
  # Used while the matching profile field is still null.
  profile_defaults:
    tmax_min_c: 18
    tmax_max_c: 28
    max_rain_days_per_month: 10
    max_transfer_h: 8
    max_safety_level: 2
