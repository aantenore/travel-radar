# travel-radar defaults. Override any key in <data home>/settings.yaml
# (data home = $TRAVEL_RADAR_HOME or ~/.travel-radar). Relative paths resolve against the data home.
paths:
  db: data/radar.sqlite
  cache_dir: data/cache
  profile: profile.yaml
  trips_dir: trips
  watches_dir: watches
  dossier_checklist: dossier_checklist.yaml   # falls back to the plugin copy

http:
  timeout_s: 20
  user_agent: travel-radar/0.6 (+https://github.com/aantenore/travel-radar)
  cache_ttl_s: 21600   # 6h

sources:
  geocoding: https://geocoding-api.open-meteo.com/v1/search
  climate_archive: https://archive-api.open-meteo.com/v1/archive
  forecast: https://api.open-meteo.com/v1/forecast
  holidays: https://date.nager.at/api/v3/PublicHolidays

climate:
  years_back: 5
  rain_day_mm: 1.0

# Checks per day by days left to departure (first matching rule wins).
cadence:
  - {min_days: 60, per_day: 1}
  - {min_days: 14, per_day: 2}
  - {min_days: 0, per_day: 4}

alerts:
  drop_pct: 10          # drop vs historical median
  new_low: true         # new all-time low
  below_budget: true    # price under the watch budget
  cooldown_h: 24        # do not repeat the same alert kind within N hours
  min_history: 3        # observations required for drop_pct
  suspect_drop_pct: 60  # drops beyond this are likely misreads: re-verify, never notify as a deal

# Which sources may produce a price observation: tier 1 airline, tier 2 travel search/booking site.
reliability:
  # Runtime verification (Wikidata) is the authority; verdicts are cached in the knowledge store.
  verify_ttl_days: 30
  fallback_ttl_days: 1      # retry verification soon when only the fallback was available
  # OFFLINE FALLBACK ONLY: used when Wikidata is unreachable or does not classify a site.
  # Observations relying on it are marked verified_by: fallback. Not the authority.
  fallback:
    tier1:   # airline official sites; "([a-z0-9-]+\.)?" allows regional subdomains (it.ceair.com)
      - '^ita-airways\.com/'
      - '^airchina\.[a-z.]+/'
      - '^([a-z0-9-]+\.)?ceair\.com/'
      - '^([a-z0-9-]+\.)?csair\.com/'
      - '^([a-z0-9-]+\.)?hainanairlines\.com/'
      - '^([a-z0-9-]+\.)?hnair\.com/'
      - '^([a-z0-9-]+\.)?sichuanair\.com/'
      - '^([a-z0-9-]+\.)?xiamenair\.com/'
      - '^([a-z0-9-]+\.)?cathaypacific\.com/'
      - '^lufthansa\.com/'
      - '^swiss\.com/'
      - '^austrian\.com/'
      - '^brusselsairlines\.com/'
      - '^saudia\.com/'
      - '^airfrance\.[a-z.]+/'
      - '^klm\.[a-z.]+/'
      - '^britishairways\.com/'
      - '^iberia\.com/'
      - '^emirates\.com/'
      - '^qatarairways\.com/'
      - '^etihad\.com/'
      - '^turkishairlines\.com/'
      - '^finnair\.com/'
      - '^singaporeair\.com/'
      - '^ana\.co\.jp/'
      - '^jal\.co\.jp/'
      - '^koreanair\.com/'
      - '^thaiairways\.com/'
      - '^united\.com/'
      - '^delta\.com/'
      - '^aa\.com/'
      - '^ryanair\.com/'
      - '^easyjet\.com/'
      - '^vueling\.com/'
      - '^wizzair\.com/'
    tier2:   # meta-search, only with exact dates
      - '^google\.[a-z.]+/travel/flights'
      - '^skyscanner\.[a-z.]+/'
      - '^kayak\.[a-z.]+/'
      - '^momondo\.[a-z.]+/'
  # A price alert fires only when independently confirmed within this window: another tier 1/2
  # site, or the same site re-read by an independent extractor (never the same fare-reader twice).
  independent_extractors: [main]
  confirm_window_h: 24
  same_source_tolerance_pct: 1    # same fare re-read on the same site
  cross_source_tolerance_pct: 5   # another tier 1/2 site

# Runtime entity verification. Class ids are Wikidata items (stable identifiers, not knowledge).
wikidata:
  api: https://www.wikidata.org/w/api.php
  sparql: https://query.wikidata.org/sparql
  search_limit: 3
  airline_classes: [Q46970]                          # airline
  travel_classes: [Q118710708, Q114106, Q1276157]    # online travel agency, metasearch engine, travel website

# How pages are read. Order is learned per source from measured outcomes (tw sources plan).
access:
  methods: [webfetch, browser]   # browser = rendered page via the session's browser tools, if available
  api_adapters:                  # used only when the env var holds a key the user configured
    serpapi: {env: SERPAPI_KEY, endpoint: "https://serpapi.com/search.json", engine: google_flights}
  prior_success: 0.5             # assumed success rate of an untried (source, method)
  max_plan_steps: 6

# Buy/wait advisor (tw advise). Booking windows in days before departure; first match wins.
# Booking windows are researched at runtime per route and season (tw knowledge, kind booking_window).
# The windows below are only a generic FALLBACK, marked heuristic, used when no fresh research exists.
advise:
  min_history: 5
  trend_days: 7
  rising_trend_pct: 5          # in-window price up this much over trend_days -> buy
  good_percentile: 25          # price at or below this percentile of own history = good
  bad_percentile: 75
  late_days: 21                # inside this, waiting rarely pays
  wait_recheck_days: 7
  close_recheck_days: 3
  high_volatility_cv: 0.15     # coefficient of variation above this lowers confidence
  booking_window_ttl_days: 90
  windows:   # fallback
    - {name: long-haul peak season, haul: long, peak: true, ideal_days: [120, 240], confidence: heuristic,
       source: "rule of thumb from fare-trend studies; calibrate with your own verified history"}
    - {name: long-haul, haul: long, peak: false, ideal_days: [90, 180], confidence: heuristic,
       source: "rule of thumb from fare-trend studies; calibrate with your own verified history"}
    - {name: short-haul peak season, haul: short, peak: true, ideal_days: [60, 120], confidence: heuristic,
       source: "rule of thumb from fare-trend studies; calibrate with your own verified history"}
    - {name: short-haul, haul: short, peak: false, ideal_days: [30, 90], confidence: heuristic,
       source: "rule of thumb from fare-trend studies; calibrate with your own verified history"}

research:
  max_fetches_per_watch: 6   # web pages per watch per run
  max_subagent_calls_per_run: 4   # fare-reader calls per monitoring run; extra watches wait for the next run
  monitor_every_h: 6         # scheduled task frequency

rollout:
  shadow_days: 14   # from first use: verdicts are logged and shown on request, not pushed as notifications

ideas:
  check_every_days: 7        # low-frequency deal/season check per idea
  season_lead_months: 3      # flag when the best month is this close

debrief:                     # topics the agent asks about when a trip is marked done
  topics:
    - pace (too fast, right, too slow)
    - crowds and how touristic it felt
    - real spend vs budget
    - places to repeat and places to avoid next time

export:
  recheck_before_days: [14, 3]   # calendar reminders to re-verify safety and entry rules

scoring:
  default_weights: {cost: 0.30, climate: 0.25, crowds: 0.20, authenticity: 0.15, logistics: 0.10}
  cost_full_score_ratio: 0.8   # <= 80% of budget -> full score
  cost_zero_score_ratio: 1.2   # >= 120% of budget -> zero
  climate_penalty_per_deg: 0.08
  rain_penalty_per_day: 0.05
  # Used while the matching profile field is still null.
  profile_defaults:
    tmax_min_c: 18
    tmax_max_c: 28
    max_rain_days_per_month: 10
    max_transfer_h: 8
    max_safety_level: 2
